<div id="table_and_form">
    <div class="card">
        <div class="card-body">

            <form class="row g-3 was-validated" hx-post="{% url 'MisCobranzas:index' %}" hx-target="#table_and_form"
                hx-swap="innerHTML" id="frm_collection">

                <div class="row g-3">
                    <div class="col-sm">
                        <label for="inputState" class="form-label">Clientes</label>
                        <select hx-get="{% url 'MisCobranzas:index' %}" hx-target="#client_contracts" name="client" id="inputState" class="form-select" aria-label="select example" required>
                            <option value selected>Elija uno ....</option>
                            {% for client in client_list %}
                            <option value="{{client.id}}">{{client.nombre}}
                                {{client.apellido1}}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-sm">
                        <label for="inputState" class="form-label">Contratos</label>
                        <select name="contract" id="client_contracts" class="form-select" required>
                            <option selected>Elija un cliente primero ...</option>
                        </select>
                    </div>

                    <div class="col-sm">
                        <label for="inputState" class="form-label">Frequencia</label>
                        <select name="frequency" id="message_frequency" class="form-select" required>
                            <option value selected>Elija uno ....</option>
                            {% for frequency in frequency_choices %}
                            <option value="{{frequency.0}}">{{frequency.1}}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="row g-3">
                    <div class="col-sm">
                        <label for="inputState" class="form-label">Notificacion</label>
                        <select name="notification" id="inputState" class="form-select" required>
                            <option value selected>Elija uno ....</option>
                            {% for notification in notification_choices %}
                            <option value="{{notification.0}}">{{ notification.1 }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-sm-8">
                        <label for="inputState" class="form-label">Su mensaje: plantilla unica</label>
                        <textarea name="body" class="form-control" placeholder rows="3" required readonly>{{cobranzas_template.0.body}}
                        </textarea>
                    </div>
                </div>
                <div class="row g-3">
                    <div class="col-sm">
                        <div class="form-check form-switch">
                            <input name="status" class="form-check-input" type="checkbox" role="switch" value=True id="flexSwitchCheckDefault" checked>
                            <label class="form-check-label" for="flexSwitchCheckDefault">Estado de la
                                Notificacion</label>
                        </div>
                    </div>
                    <br>
                    <div class="col-auto">
                        <button type="submit" id="btn_submit"
                            class="btn btn-success btn-sm btn-lb-primary">Enviar</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div id="scheduled_collections_tbl"> <!-- start of scheduled_collections_tbl -->
        {% include 'MisCobranzas/partials/htmx_schedule_partial.html' %}
    </div> <!-- end of scheduled_collections_tbl -->

</div>
